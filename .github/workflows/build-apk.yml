name: Build APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Etiqueta para compilar (v1.0)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          cd app
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign with debug key
        run: |
          cd app
          keytool -genkeypair -v -keystore debug.jks -storepass android \
            -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          $ANDROID_HOME/build-tools/35.0.0/apksigner sign \
            --ks debug.jks --ks-pass pass:android --key-pass pass:android \
            --out ../perfiles.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: perfiles-apk
          path: perfiles.apk

      - name: Publicar en el release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: perfiles.apk
